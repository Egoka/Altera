name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - app
  # Решение владельца 2026-09-19: PR вливаются без обновления до актуальной app, поэтому
  # несовместимость двух по отдельности зелёных PR ловит отдельный прогон самой app после merge.
  push:
    branches:
      - app

jobs:
  checks:
    name: Формат, линт и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Версия pnpm берётся из поля packageManager в корневом package.json.
      # Дублировать её здесь нельзя: action-setup падает с «Multiple versions of pnpm specified».
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Print Node.js version
        run: node -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: GraphQL codegen drift
        run: pnpm codegen --check
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Direct chat and Multica routing
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/agent-loop -p test_chat_routing.py
      - name: Autonomy controller tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/autonomy -p 'test_*.py'
      - name: Dependency probe safety tests
        run: node --test scripts/autonomy/infra_probe.test.mjs

  web-checks:
    name: Сборка и типизация веба
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Print Node.js version
        run: node -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter nuxt-app run build
      - name: Smoke check production web
        run: pnpm --filter nuxt-app run smoke
      - name: Typecheck web
        run: pnpm --filter nuxt-app run typecheck

  web-smoke:
    name: Браузерная проверка веба
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: altera_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d altera_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Локальный SMTP-приёмник для письма входа (T-021); порты совпадают с docker-compose.yml.
      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 21025:1025
          - 28025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALTERA_ISOLATED_CI: "1"
      DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/altera_ci"
      DATABASE_URL_UNPOOLED: "postgresql://test:test@127.0.0.1:5432/altera_ci"
      LOG_HASH_SECRET: "ci-log-hash-secret"
      NODE_ENV: test
      REDIS_URL: "redis://127.0.0.1:6379/0"
      T069_TEST_DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/altera_ci"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Print Node.js version
        run: node -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy migrations to isolated browser-test database
        run: node scripts/autonomy/infra_probe.mjs --migrate
      - name: Install Chromium
        run: pnpm --filter nuxt-app exec playwright install --with-deps chromium
      - name: Smoke check homepage
        run: pnpm --filter nuxt-app run test:e2e

  server-smoke:
    name: Сборка сервера и дымовая проверка старта
    runs-on: ubuntu-latest

    # Сервисы принадлежат только этому job. Миграции и реальные SELECT 1/PING
    # проверяются отдельно: GraphQL __typename сам не обращается к зависимостям.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: altera_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d altera_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 4000
      NODE_ENV: test
      ALTERA_ISOLATED_CI: "1"
      RENDER_GIT_COMMIT: ${{ github.sha }}
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/altera_ci"
      DATABASE_URL_UNPOOLED: "postgresql://test:test@127.0.0.1:5432/altera_ci"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      CACHE_TTL: 21600
      JWT_ACCESS_SECRET: "test-access-secret"
      JWT_REFRESH_SECRET: "test-refresh-secret"
      LOG_HASH_SECRET: "ci-log-hash-secret"
      REQUEST_ID_FORWARD_SECRET: "ci-request-id-secret"
      T016_TEST_DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/altera_ci"
      T047_TEST_DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/altera_ci"
      MAGIC_LINK_EXPIRY_MINUTES: 15
      MAGIC_LINK_BASE_URL: "http://localhost:3000/auth/verify"
      JWT_ACCESS_TOKEN_EXPIRY: "15m"
      JWT_REFRESH_TOKEN_EXPIRY: "7d"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Версия pnpm берётся из поля packageManager в корневом package.json.
      # Дублировать её здесь нельзя: action-setup падает с «Multiple versions of pnpm specified».
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Print Node.js version
        run: node -v
      - name: Install server dependencies
        run: cd server && pnpm install --frozen-lockfile
      - name: Build server
        run: cd server && pnpm run build:ci
      - name: Test media asset migration
        run: pnpm --filter server exec vitest run tests/media-asset-migration-database.test.ts
      - name: Test database job queue
        run: pnpm --filter server exec vitest run tests/job-queue-database.test.ts
      - name: Check build output
        run: test -f server/dist/server.js
      - name: Deploy migrations to isolated CI database
        run: node scripts/autonomy/infra_probe.mjs --migrate
      - name: Проверить детерминированный seed T-007
        env:
          T007_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: cd server && pnpm exec vitest run tests/seed-database.test.ts
      - name: Проверить историю писем T-021
        env:
          T021_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: cd server && pnpm exec vitest run tests/mail-history-database.test.ts
      - name: Проверить инварианты миграции T-017
        env:
          T017_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: cd server && pnpm exec vitest run tests/bookmark-plan-migration-database.test.ts
      - name: Require PostgreSQL 17 and Redis readiness
        run: node scripts/autonomy/infra_probe.mjs
      # Раньше здесь стояло `timeout 2s pnpm start || true`: падение старта не делало
      # проверку красной. Скрипт smoke.sh ошибки не глушит и печатает вывод сервера.
      - name: Smoke check server start
        run: cd server && pnpm run smoke

  # Защита ветки app требует обязательную проверку с контекстом `test`
  # (repos/Egoka/Altera/branches/app/protection → required_status_checks.contexts).
  # Контекст равен отображаемому имени джоба, а имена двух джобов выше — русские,
  # поэтому нужен отдельный джоб именно с именем `test`. Он же развязывает защиту
  # ветки от переименования джобов в будущем.
  #
  # `if: always()` обязателен: без него джоб был бы пропущен при падении зависимостей,
  # а пропущенный обязательный контекст GitHub засчитывает как успешный — проверка
  # стала бы зелёной на красном CI. Поэтому результат зависимостей проверяется явно.
  test:
    name: test
    needs: [checks, web-checks, web-smoke, server-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Свести результаты проверок
        run: |
          echo "Формат, линт и тесты: ${{ needs.checks.result }}"
          echo "Сборка и типизация веба: ${{ needs['web-checks'].result }}"
          echo "Браузерная проверка веба: ${{ needs['web-smoke'].result }}"
          echo "Сборка и дымовая проверка: ${{ needs['server-smoke'].result }}"
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "::error::джоб «Формат, линт и тесты» завершился как ${{ needs.checks.result }}"
            exit 1
          fi
          if [ "${{ needs['web-checks'].result }}" != "success" ]; then
            echo "::error::джоб «Сборка и типизация веба» завершился как ${{ needs['web-checks'].result }}"
            exit 1
          fi
          if [ "${{ needs['web-smoke'].result }}" != "success" ]; then
            echo "::error::джоб «Браузерная проверка веба» завершился как ${{ needs['web-smoke'].result }}"
            exit 1
          fi
          if [ "${{ needs['server-smoke'].result }}" != "success" ]; then
            echo "::error::джоб «Сборка сервера и дымовая проверка старта» завершился как ${{ needs['server-smoke'].result }}"
            exit 1
          fi
          echo "Все проверки успешны."
