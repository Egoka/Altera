name: Ветка Neon для pull request

# Одноразовая ветка базы Neon на каждый прогон pull request: создаётся в начале прогона
# и удаляется в его конце, даже если проверки на ней упали или прогон отменили.
# Шаблон — руководство https://neon.com/docs/guides/neon-github-app. Секрет NEON_API_KEY
# и переменную NEON_PROJECT_ID записала интеграция Neon GitHub App (2026-09-14). Родитель
# ветки не задан, поэтому это ветка проекта по умолчанию в Neon.
#
# Раньше ветка жила до закрытия pull request. Бесплатный план Neon держит не больше
# 10 веток на проект, поэтому при нескольких открытых PR лимит кончался и следующие
# прогоны падали с «branches limit exceeded». Теперь ветка занимает место только на время
# прогона. При закрытии PR удаление запускается ещё раз и снимает ветку, если она осталась
# от прерванного прогона или от прежней схемы.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # Имя прежней схемы: по нему находятся и ветки, созданные до перехода на одноразовые.
  NEON_BRANCH: preview/pr-${{ github.event.number }}-${{ github.head_ref }}

jobs:
  create_neon_branch:
    name: Создать ветку Neon
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # neondatabase/create-branch-action@v6 ждёт ответа API не дольше 10 секунд и не
      # повторяет запрос: 2026-10-01 в 15:33–15:36 UTC API Neon отвечал медленнее, и прогоны
      # PR #396 и #397 упали с «AxiosError: timeout of 10000ms exceeded», хотя ветка не
      # создалась. Здесь те же вызовы с таймаутом 30 секунд и тремя попытками. Как и экшен,
      # шаг сначала ищет ветку по имени, поэтому повтор после запроса, который всё же дошёл до
      # Neon, не создаёт вторую ветку.
      - name: Create Neon Branch
        id: create_neon_branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          # Поиск повторяет сам curl, молча (-s без -S): исход, удачный или нет, сообщает шаг.
          find_branch() {
            curl -fs --max-time 30 --retry 3 --retry-all-errors --retry-delay 5 --get \
              -H "Authorization: Bearer $NEON_API_KEY" --data-urlencode "search=$NEON_BRANCH" "$api" |
              jq -r --arg name "$NEON_BRANCH" 'first(.branches[] | select(.name == $name) | .id) // empty'
          }
          body=$(jq -n --arg name "$NEON_BRANCH" '{branch: {name: $name}, endpoints: [{type: "read_write"}]}')
          id=""
          for attempt in 1 2 3; do
            if ! id=$(find_branch); then
              echo "::error::API Neon не ответил на поиск ветки $NEON_BRANCH."
              exit 1
            fi
            if [ -n "$id" ]; then
              echo "Ветка $NEON_BRANCH уже есть ($id)."
              break
            fi
            # Создание вслепую не повторяется: следующая попытка сначала ищет ветку.
            if id=$(curl -fs --max-time 30 -X POST -H "Authorization: Bearer $NEON_API_KEY" \
              -H "Content-Type: application/json" -d "$body" "$api" | jq -re '.branch.id'); then
              echo "Создана ветка $NEON_BRANCH ($id)."
              break
            fi
            id=""
            echo "Попытка $attempt: API Neon не подтвердил создание ветки."
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          if [ -z "$id" ]; then
            echo "::error::Ветка $NEON_BRANCH не создана за три попытки."
            exit 1
          fi
          echo "branch_id=$id" >> "$GITHUB_OUTPUT"

      # Ветка создана и живёт до конца этого прогона. Проверки на ней добавляются сюда, до
      # удаления; её id — steps.create_neon_branch.outputs.branch_id. Строку подключения даёт
      # GET /projects/{project_id}/connection_uri с branch_id, database_name=neondb,
      # role_name=neondb_owner и pooled=true|false. В ней логин и пароль базы: перед записью в
      # $GITHUB_OUTPUT её маскируют (::add-mask::) и в лог не печатают.
      #
      # Пример миграций — пока не включён, решение отдельное (db_url и db_url_pooled — строки
      # подключения из connection_uri):
      #      - name: Миграции Prisma
      #        run: cd server && npx prisma migrate deploy
      #        env:
      #          DATABASE_URL: "${{ steps.create_neon_branch.outputs.db_url_pooled }}"
      #          DATABASE_URL_UNPOOLED: "${{ steps.create_neon_branch.outputs.db_url }}"
      #
      # Schema diff комментарием к pull request (джобу нужны permissions: contents: read и
      # pull-requests: write; см. https://github.com/neondatabase/schema-diff-action):
      #      - name: Schema diff в комментарий к pull request
      #        uses: neondatabase/schema-diff-action@v1
      #        with:
      #          project_id: ${{ vars.NEON_PROJECT_ID }}
      #          compare_branch: ${{ env.NEON_BRANCH }}
      #          api_key: ${{ secrets.NEON_API_KEY }}

  delete_neon_branch:
    name: Удалить ветку Neon
    needs: create_neon_branch
    # always(): удалить и после упавшего или отменённого создания, и при закрытии PR,
    # когда создание пропущено.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # neondatabase/delete-branch-action падает, если ветки нет. Здесь отсутствие ветки —
      # нормальный исход: её уже удалил прошлый прогон или создание не удалось.
      - name: Delete Neon Branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches"
          ids=$(curl -fsS --get -H "Authorization: Bearer $NEON_API_KEY" \
            --data-urlencode "search=$NEON_BRANCH" "$api" |
            jq -r --arg name "$NEON_BRANCH" '.branches[] | select(.name == $name) | .id')
          if [ -z "$ids" ]; then
            echo "Ветки $NEON_BRANCH нет, удалять нечего."
            exit 0
          fi
          for id in $ids; do
            curl -fsS -X DELETE -H "Authorization: Bearer $NEON_API_KEY" "$api/$id" > /dev/null
            echo "Удалена ветка $NEON_BRANCH ($id)."
          done
