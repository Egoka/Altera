# Профиль автора публичной страницы (`docs/spec/20-public/author.md` §4). Публичный тип не
# содержит e-mail, роли, плана, срока и сессий (`50-access/visibility.md` п. 4, ADR-0018):
# уровень автора виден бейджем `grade`, числа рейтинга наружу не выходят (журнал §21.18).
#
# Подписки на автора здесь нет: `followAuthor` и число подписчиков — этап 3 и F-10
# (`author.md` §1, §6), поэтому поля подписки появятся вместе со своей моделью.

# Ссылка на соцсеть: вид и адрес, как в профиле аккаунта
# (`30-account/reader/profile-edit.md` §4). Адреса проверяются на схему при чтении.
type AuthorLink {
  kind: String!
  url: String!
}

type AuthorProfile {
  id: ID!
  handle: String!
  name: String!
  bio: String
  avatar: String
  links: [AuthorLink!]!
  grade: AuthorGrade!
  # Число опубликованных материалов и дата первой публикации по всем языкам: у запроса нет
  # аргумента локали, а условие существования страницы (§1) тоже не зависит от языка.
  publishedCount: Int!
  firstPublishedAt: String
  # Прежний хэндл ведёт на нынешний: страница отвечает 301 (`00-registries/routes.md` #7).
  # У канонического адреса поле пустое.
  redirect: String
}

extend type Query {
  # Неизвестный хэндл и аккаунт без публикаций — `NOT_FOUND` (404); архивированный аккаунт —
  # `ARCHIVED` (410, журнал §28.2: профиль больше не публичен). Отдельного поля «архивирован»
  # у типа нет: снятому аккаунту страница показывает только текст «страница автора недоступна».
  author(handle: String!): AuthorProfile!
}
