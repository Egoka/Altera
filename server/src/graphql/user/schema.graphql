scalar JSON
enum Role {
  reader
  author
  editor
  moderator
  analyst
  admin
  owner
}

enum Locale {
  ru
  en
}

enum ProfileCheckStatus {
  ok
  pending
  rejected
}

type User {
  id: ID!
  name: String!
  bio: String
  photoUrl: String
  handle: String!
  socialLinks: JSON
  createdAt: String!
  updatedAt: String!
  # Для страницы автора
  articles: [Article!]
  # Количество статей (для админ панели)
  _count: UserCount
}

type AccountUser {
  id: ID!
  name: String!
  email: String!
  bio: String
  photoUrl: String
  role: Role!
  handle: String!
  locale: Locale!
  avatarAssetId: ID
  prevAvatarId: ID
  nameCheckStatus: ProfileCheckStatus!
  avatarCheckStatus: ProfileCheckStatus!
  socialLinks: JSON
  createdAt: String!
  updatedAt: String!
  articles: [Article!]
  _count: UserCount
}

type UserCount {
  articles: Int!
}

# Специфичные для пользователей фильтры
input UserFiltersInput {
  base: BaseFiltersInput

  # Специфичные для пользователей
  role: [Role!]
  hasArticles: Boolean
}

type UsersResponse {
  users: [AccountUser!]!
  pagination: PaginationInfo!
  filters: UserFilters!
  sort: SortInfo!
  search: SearchInfo
}

type UserFilters {
  base: BaseFiltersInfo
  role: [Role!]
  hasArticles: Boolean
}

type UserArticleStats {
  total: Int!
  published: Int!
  draft: Int!
  review: Int!
  archived: Int!
}

extend type Query {
  user(handle: String!): User
  me: AccountUser
  myArticlesStats: UserArticleStats

  # Публичная страница автора живёт в собственном модуле: `author(handle)` отдаёт профиль
  # по `20-public/author.md` §4, лента — `feed(scope: author)`. Черновые `author`,
  # `articlesByAuthor` и `authorStats` отдавали полный `User` и ни архива аккаунта, ни
  # истории хэндлов, ни локали не знали, поэтому сняты вместе с T-057.

  # Запросы для управления пользователями (требуют права admin)
  users(pagination: PaginationInput!, sort: SortInput!, filters: UserFiltersInput!, search: SearchInput): UsersResponse!
  adminUser(id: ID!): AccountUser
}
