scalar JSON
enum Role {
  reader
  author
  editor
  moderator
  analyst
  admin
  owner
}

enum Locale {
  ru
  en
}

enum ProfileCheckStatus {
  ok
  pending
  rejected
}

type User {
  id: ID!
  name: String!
  bio: String
  photoUrl: String
  handle: String!
  socialLinks: JSON
  createdAt: String!
  updatedAt: String!
  # Для страницы автора
  articles: [Article!]
  # Количество статей (для админ панели)
  _count: UserCount
}

type AccountUser {
  id: ID!
  name: String!
  email: String!
  bio: String
  photoUrl: String
  role: Role!
  handle: String!
  handleConfirmed: Boolean!
  handleChangedAt: String
  locale: Locale!
  avatarAssetId: ID
  prevAvatarId: ID
  nameCheckStatus: ProfileCheckStatus!
  pendingName: String
  nameCheckReason: String
  avatarCheckStatus: ProfileCheckStatus!
  avatarCheckReason: String
  socialLinks: JSON
  archivedAt: String
  createdAt: String!
  updatedAt: String!
  articles: [Article!]
  _count: UserCount
}

input UpdateProfileInput {
  name: String!
  handle: String!
  bio: String
  socialLinks: JSON
  locale: Locale!
}

type HandleAvailability {
  handle: String!
  available: Boolean!
}

enum ProfileReviewField {
  name
}

enum ProfileReviewVerdict {
  approve
  reject
}

type ProfileReviewResult {
  id: ID!
  handle: String!
  name: String!
  pendingName: String
  nameCheckStatus: ProfileCheckStatus!
  nameCheckReason: String
  avatarCheckStatus: ProfileCheckStatus!
  avatarCheckReason: String
}

type UserCount {
  articles: Int!
}

type UserArticleStats {
  total: Int!
  published: Int!
  draft: Int!
  review: Int!
  archived: Int!
}

extend type Query {
  user(handle: String!): User
  me: AccountUser
  myArticlesStats: UserArticleStats
  checkHandle(handle: String!): HandleAvailability!

  # Публичная страница автора живёт в собственном модуле: `author(handle)` отдаёт профиль
  # по `20-public/author.md` §4, лента — `feed(scope: author)`. Черновые `author`,
  # `articlesByAuthor` и `authorStats` отдавали полный `User` и ни архива аккаунта, ни
  # истории хэндлов, ни локали не знали, поэтому сняты вместе с T-057.

  # Список и карточка обычных аккаунтов живут в модуле `admin-users`: `adminUsers(filters)`
  # отдаёт маску адреса без записи аудита, `adminUser(id)` — полный адрес с записью
  # `admin.read.personal` (`40-admin/users.md` §3, §8). Черновые `users` и `adminUser` отдавали
  # весь `AccountUser` и писали чтение ПДн на каждую строку списка, поэтому сняты вместе с T-073.
}

extend type Mutation {
  updateProfile(input: UpdateProfileInput!): AccountUser!
  decideProfileCheck(
    userId: ID!
    field: ProfileReviewField!
    verdict: ProfileReviewVerdict!
    reason: String
  ): ProfileReviewResult!
}
