scalar JSON
enum Role {
  reader
  author
  editor
  moderator
  analyst
  admin
  owner
}

enum Locale {
  ru
  en
}

enum ProfileCheckStatus {
  ok
  pending
  rejected
}

type User {
  id: ID!
  name: String!
  bio: String
  photoUrl: String
  handle: String!
  socialLinks: JSON
  createdAt: String!
  updatedAt: String!
  # Для страницы автора
  articles: [Article!]
  # Количество статей (для админ панели)
  _count: UserCount
}

type AccountUser {
  id: ID!
  name: String!
  email: String!
  bio: String
  photoUrl: String
  role: Role!
  handle: String!
  locale: Locale!
  avatarAssetId: ID
  prevAvatarId: ID
  nameCheckStatus: ProfileCheckStatus!
  avatarCheckStatus: ProfileCheckStatus!
  socialLinks: JSON
  createdAt: String!
  updatedAt: String!
  articles: [Article!]
  _count: UserCount
}

type UserCount {
  articles: Int!
}

# Специфичные для пользователей фильтры
input UserFiltersInput {
  base: BaseFiltersInput

  # Специфичные для пользователей
  role: [Role!]
  hasArticles: Boolean
}

type UsersResponse {
  users: [AccountUser!]!
  pagination: PaginationInfo!
  filters: UserFilters!
  sort: SortInfo!
  search: SearchInfo
}

type UserFilters {
  base: BaseFiltersInfo
  role: [Role!]
  hasArticles: Boolean
}

type UserArticleStats {
  total: Int!
  published: Int!
  draft: Int!
  review: Int!
  archived: Int!
}

type AuthorStats {
  totalArticles: Int!
  articlesThisMonth: Int!
  popularTags: [Tag!]
}

type ArticlesByAuthorResponse {
  articles: [Article!]!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
}

extend type Query {
  user(handle: String!): User
  me: AccountUser
  myArticlesStats: UserArticleStats

  # Запросы для страницы автора
  author(handle: String!): User
  articlesByAuthor(authorHandle: String!, page: Int = 1, limit: Int = 10): ArticlesByAuthorResponse!
  authorStats(authorHandle: String!): AuthorStats

  # Запросы для управления пользователями (требуют права admin)
  users(pagination: PaginationInput!, sort: SortInput!, filters: UserFiltersInput!, search: SearchInput): UsersResponse!
  adminUser(id: ID!): AccountUser
}
