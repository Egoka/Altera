enum TaxonomyStatus {
  active
  archived
}

type Section {
  id: ID!
  name: String!
  nameEn: String
  slug: String!
  description: String
  descriptionEn: String
  seoTitle: String
  seoTitleEn: String
  seoDescription: String
  seoDescriptionEn: String
  order: Int!
  status: TaxonomyStatus!
  successor: Section
  archivedAt: String
  archivedByActorId: ID
  archivedByRole: Role
  createdAt: String!
  updatedAt: String!
  # Связь со статьями
  articles: [Article!]
  # Количество статей (для админ панели)
  _count: SectionCount
}

type SectionCount {
  articles: Int!
}

type FormatCount {
  articles: Int!
}

type AdminFormat {
  id: ID!
  name: String!
  nameEn: String
  slug: String!
  description: String
  descriptionEn: String
  status: TaxonomyStatus!
  archivedAt: String
  createdAt: String!
  updatedAt: String!
  _count: FormatCount!
}

input FormatFiltersInput {
  status: [TaxonomyStatus!]
  hasArticles: Boolean
}

type FormatsResponse {
  formats: [AdminFormat!]!
  pagination: PaginationInfo!
}

type TaxonomyAuditEntry {
  id: ID!
  action: String!
  actorId: ID
  actorRole: Role
  entityType: String!
  entityId: ID!
  diff: JSON
  requestId: String
  createdAt: String!
}

# Минимальный публичный контракт рубрики для навигации. Административные поля
# и произвольные фильтры намеренно остаются в закрытом `sections`.
type PublicSection {
  id: ID!
  name: String!
  nameEn: String
  slug: String!
  order: Int!
  articleCount: Int!
}

# Специфичные для типов контента фильтры
input SectionFiltersInput {
  base: BaseFiltersInput

  # Специфичные для типов контента
  status: [TaxonomyStatus!]
  hasArticles: Boolean
}

type SectionsResponse {
  sections: [Section!]!
  pagination: PaginationInfo!
  filters: SectionFilters!
  sort: SortInfo!
  search: SearchInfo
}

type SectionFilters {
  base: BaseFiltersInfo
  status: [TaxonomyStatus!]
  hasArticles: Boolean
}

type SectionStats {
  totalArticles: Int!
  articlesThisMonth: Int!
  averageReadTime: Float
  popularTags: [Tag!]
  topAuthors: [User!]
}

type ArticlesBySectionResponse {
  articles: [Article!]!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
}

extend type Query {
  # Запросы для страницы типа контента
  section(slug: String!): Section
  publicSections: [PublicSection!]!
  articlesBySection(sectionSlug: String!, page: Int = 1, limit: Int = 10): ArticlesBySectionResponse!
  sectionStats(sectionSlug: String!): SectionStats

  # Запросы для управления типами контента (требуют права admin)
  sections(
    pagination: PaginationInput!
    sort: SortInput!
    filters: SectionFiltersInput!
    search: SearchInput
  ): SectionsResponse!
  formats(pagination: PaginationInput!, sort: SortInput!, filters: FormatFiltersInput!): FormatsResponse!
  taxonomyAudit(entityType: String!, entityId: ID!): [TaxonomyAuditEntry!]!
}

# Input типы для мутаций
input CreateSectionInput {
  name: String!
  nameEn: String!
  slug: String!
  description: String
  descriptionEn: String
  seoTitle: String
  seoTitleEn: String
  seoDescription: String
  seoDescriptionEn: String
  order: Int!
}

input UpdateSectionInput {
  name: String
  nameEn: String
  slug: String
  description: String
  descriptionEn: String
  seoTitle: String
  seoTitleEn: String
  seoDescription: String
  seoDescriptionEn: String
  order: Int
}

input ReorderSectionsInput {
  items: [ReorderItemInput!]!
}

input ReorderItemInput {
  id: ID!
  order: Int!
}

input CreateFormatInput {
  name: String!
  nameEn: String
  slug: String!
  description: String
  descriptionEn: String
}

input UpdateFormatInput {
  name: String
  nameEn: String
  slug: String
  description: String
  descriptionEn: String
}

extend type Mutation {
  # Админ мутации для управления типами контента
  createSection(input: CreateSectionInput!): Section!
  updateSection(id: ID!, input: UpdateSectionInput!): Section!
  deleteSection(id: ID!): Section!
  reorderSections(input: ReorderSectionsInput!): [Section!]!
  archiveSection(id: ID!, successorId: ID!, reason: String!): Section!
  restoreSection(id: ID!): Section!
  createFormat(input: CreateFormatInput!): AdminFormat!
  updateFormat(id: ID!, input: UpdateFormatInput!): AdminFormat!
  archiveFormat(id: ID!): AdminFormat!
  restoreFormat(id: ID!): AdminFormat!
}
