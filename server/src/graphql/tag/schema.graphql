type Tag {
  id: ID!
  name: String!
  nameEn: String
  slug: String!
  description: String
  status: TaxonomyStatus!
  mergedInto: Tag
  createdByActorId: ID
  createdByRole: Role
  archivedAt: String
  archivedByActorId: ID
  archivedByRole: Role
  createdAt: String!
  updatedAt: String!
  # Связь со статьями
  articles: [Article!]
  # Количество статей (для админ панели)
  _count: TagCount
}

type TagCount {
  articles: Int!
}

# Специфичные для тегов фильтры
input TagFiltersInput {
  base: BaseFiltersInput

  # Специфичные для тегов
  hasArticles: Boolean
}

type TagsResponse {
  tags: [Tag!]!
  pagination: PaginationInfo!
  filters: TagFilters!
  sort: SortInfo!
  search: SearchInfo
}

type TagFilters {
  base: BaseFiltersInfo
  hasArticles: Boolean
}

type TagStats {
  totalArticles: Int!
  articlesThisMonth: Int!
  averageReadTime: Float
  popularAuthors: [User!]
}

type ArticlesByTagResponse {
  articles: [Article!]!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
}

extend type Query {
  # Запросы для страницы тега
  tag(slug: String!): Tag
  articlesByTag(tagSlug: String!, page: Int = 1, limit: Int = 10): ArticlesByTagResponse!
  tagStats(tagSlug: String!): TagStats

  # Запросы для управления тегами (требуют права admin)
  tags(pagination: PaginationInput!, sort: SortInput!, filters: TagFiltersInput!, search: SearchInput): TagsResponse!
}

# Input типы для мутаций
input CreateTagInput {
  name: String!
  nameEn: String
  slug: String!
  description: String
}

input UpdateTagInput {
  name: String
  nameEn: String
  slug: String
  description: String
}

input MergeTagsInput {
  sourceTagIds: [ID!]!
  targetTagId: ID!
}

extend type Mutation {
  # Админ мутации для управления тегами
  createTag(input: CreateTagInput!): Tag!
  updateTag(id: ID!, input: UpdateTagInput!): Tag!
  deleteTag(id: ID!): Tag!
  mergeTags(input: MergeTagsInput!): Tag!
  archiveTag(id: ID!): Tag!
  restoreTag(id: ID!): Tag!
}
