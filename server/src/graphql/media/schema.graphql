"""
Файл multipart-запроса GraphQL. Имя файла и объявленный тип конвейер не использует: фактический
тип определяется по содержимому (`upload-pipeline.md` п. 3).
"""
scalar File

"Справочник лицензий медиа (ADR-0008 п. 3)."
enum MediaLicense {
  own
  cc_by
  cc_by_sa
  cc_by_nc
  cc0
  public_domain
  permission
}

"""
Состояние обработки (журнал §29.12). Публичный доступ к файлу появляется только после `ready`
(`access-and-signed-urls.md` п. 1).
"""
enum MediaProcessingStatus {
  uploading
  queued
  processing
  ready
  failed
}

type MediaAsset {
  id: ID!
  processingStatus: MediaProcessingStatus!
  mimeType: String!
  byteSize: Int!
  width: Int
  height: Int
  """
  Единое описание медиафайла. Его создаёт конвейер; автор его не задаёт и не редактирует, а
  размещение в статье не переопределяет (журнал §29.13).
  """
  alt: String
  caption: String
  attribution: String!
  license: MediaLicense!
  licenseNote: String
  """
  Набор производных изображения: `placeholder` — строка `data:` размытого заполнителя,
  `thumbnailWidth` — ширина варианта для списков, `items` — публичные варианты
  (`format`, `width`, `height`, `url`) в AVIF и WebP по централизованной матрице (журнал §29.4).
  Пока шаг конвейера не прошёл — `items` пуст. Веб строит из набора `<picture>` с `srcset`.
  """
  variants: JSON!
  createdAt: String!
}

extend type Mutation {
  """
  Загрузка медиа версии статьи: файл принимается в карантин и обрабатывается заданием очереди.
  Лицензия и атрибуция обязательны; `alt` автор не задаёт (журнал §29.13).
  """
  uploadMedia(translationId: ID!, file: File!, license: MediaLicense!, attribution: String!): MediaAsset!
  """
  Исправление описания `alt` у медиафайла. Редкое исключение из правила «описание создаёт
  конвейер»: автор и рецензент его не меняют, узел документа не переопределяет — исправить может
  только `admin` непосредственно у медиафайла (матрица #40, журнал §29.13). Действие пишется
  общей оболочкой аудита `admin.change` (#75) со значениями до и после.
  """
  adminUpdateMediaAlt(assetId: ID!, alt: String!): MediaAsset!
}
