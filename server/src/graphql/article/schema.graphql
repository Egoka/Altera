enum ArticleStatus {
  draft
  ai_check
  review
  in_review
  rework
  published
  archived
}

enum MyArticleStatus {
  draft
  ai_check
  review
  rework
  published
  rejected
  archived
}

enum ArticleArchiveActor {
  self
  staff
}

"""
Фокусная точка обложки долями стороны (`03-data-model.md`: `focalX`, `focalY`). Кадр карточки
ставится по ней так же, как CSS `object-position`, поэтому предпросмотр в редакторе совпадает с
тем, что нарежет сервер.
"""
type FocalPoint {
  x: Float!
  y: Float!
}

input FocalPointInput {
  x: Float!
  y: Float!
}

"""
Обложка материала (`docs/spec/85-media-and-binary/article-covers.md`). Одна на материал и общая
для языковых версий (ADR-0002); обязательна перед публикацией (журнал §29.1).
"""
type ArticleCover {
  "Запись медиа, которой служит обложка."
  assetId: ID!
  "Адрес наибольшего готового варианта WebP исходной композиции — один адрес для `<img>`."
  url: String!
  """
  Набор вариантов: базовые по общей матрице и кадры карточек по фокусной точке. У кадра есть
  поле `crop` (`lede`, `large`); вариант без него сохраняет композицию мастера. Веб строит
  `<picture>` с `srcset` из нужного кадра (`image-variants.md` §2 п. 5).
  """
  variants: JSON!
  "Единое описание медиафайла; узел документа его не переопределяет (журнал §29.13)."
  alt: String
  focal: FocalPoint!
}

type Article {
  id: ID!
  title: String!
  slug: String!
  dek: String
  body: String!
  excerpt: String
  featuredImage: String
  "Обложка материала; `null` — обложки нет или её обработка не завершена."
  cover: ArticleCover
  status: ArticleStatus!
  publishedAt: String
  createdAt: String!
  updatedAt: String!
  author: User!
  section: Section
  format: Format
  tags: [Tag!]!
  """
  Языковые версии материала. Адрес редактора называет версию, а не материал
  (`30-account/author/article-edit.md` §3, `00-registries/routes.md` #36), поэтому создание
  черновика возвращает и её идентификатор.
  """
  translations: [TranslationSibling!]!
}

type MyArticleTranslation {
  id: ID!
  locale: Locale!
  slug: String!
  title: String!
  status: ArticleStatus!
  rejected: Boolean!
  publishedAt: String
  updatedAt: String!
  reeditUntil: String
  lastReviewMessageAt: String
  unread: Boolean!
}

type MyArticle {
  id: ID!
  status: ArticleStatus!
  "Обложка материала; `null` — обложки нет, и кабинет показывает заполнитель (`article-covers.md` п. 4)."
  cover: ArticleCover
  archivedBy: ArticleArchiveActor
  section: Section
  format: Format
  tags: [Tag!]!
  translations: [MyArticleTranslation!]!
}

type MyArticleCounts {
  total: Int!
  draft: Int!
  ai_check: Int!
  review: Int!
  rework: Int!
  published: Int!
  rejected: Int!
  archived: Int!
}

type MyArticlesPageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

type MyArticlesConnection {
  items: [MyArticle!]!
  counts: MyArticleCounts!
  pageInfo: MyArticlesPageInfo!
}

# Специфичные для статей фильтры
input ArticleFiltersInput {
  # Наследуем базовые фильтры
  base: BaseFiltersInput

  # Статус статей
  status: [ArticleStatus!]

  # Специфичные для статей
  authorId: [ID!]
  sectionId: [ID!]
  tagIds: [ID!]
  publishedAt: DateRangeInput
}

type ArticlesResponse {
  articles: [Article!]!
  pagination: PaginationInfo!
  filters: ArticleFilters!
  sort: SortInfo!
  search: SearchInfo
}

type ArticleFilters {
  base: BaseFiltersInfo
  status: [ArticleStatus!]
  authorId: [ID!]
  sectionId: [ID!]
  tagIds: [ID!]
  publishedAt: DateRangeInfo
}

type ArticleDetail {
  article: Article!
  recommendedArticles: [Article!]!
  relatedArticles: [Article!]!
  articleStats: ArticleStats
}

type ArticleStats {
  readTime: Int! # В минутах
  wordCount: Int!
  viewCount: Int # В будущем
  shareCount: Int # В будущем
}

type GoneArticle {
  title: String!
  firstPublishedAt: String!
  unpublishedAt: String
  author: User!
  section: Section
}

type RelatedArticlesResponse {
  articles: [Article!]!
  totalCount: Int!
}

extend type Query {
  article(slug: String!): Article
  gone(locale: Locale!, sectionSlug: String!, slug: String!): GoneArticle

  # Комплексный запрос для страницы статьи
  articleDetail(slug: String!): ArticleDetail

  # Отдельные запросы для страницы статьи
  recommendedArticles(articleSlug: String!, limit: Int = 5): [Article!]!
  relatedArticles(articleSlug: String!, limit: Int = 10): [Article!]!
  articleStats(slug: String!): ArticleStats

  # Подборки главной отдаёт `feed(scope: home, locale)` — `graphql/feed/schema.graphql`.

  # Запросы для управления статьями (требуют права admin)
  articles(
    pagination: PaginationInput!
    sort: SortInput!
    filters: ArticleFiltersInput!
    search: SearchInput
  ): ArticlesResponse!

  myArticles(status: [MyArticleStatus!], cursor: ID, limit: Int = 20): MyArticlesConnection!
}

# Типы для мутаций
input CreateArticleInput {
  sectionId: ID
  locale: Locale
}

input UpdateArticleInput {
  title: String
  body: String
  slug: String
  dek: String
  excerpt: String
  featuredImage: String
  sectionId: ID
  formatId: ID
  tags: [ID!]
}

type Format {
  id: ID!
  name: String!
  nameEn: String
  slug: String!
  description: String
  descriptionEn: String
  status: TaxonomyStatus!
  archivedAt: String
  createdAt: String!
  updatedAt: String!
}

extend type Mutation {
  createArticle(input: CreateArticleInput!): Article!
  updateArticle(id: ID!, input: UpdateArticleInput!): Article!

  # Мутации для смены статуса
  archiveArticle(id: ID!, reason: String): Article!
  restoreArticle(id: ID!): Article!

  """
  Выбор обложки и кадрирования (`article-covers.md` п. 1–3): запись медиа становится обложкой
  материала, фокусная точка задаёт кадр карточек, кадры собираются до ответа. `assetId: null`
  снимает обложку. Опубликованный материал обложку так не меняет — правка идёт в копии через
  AI-проверку (журнал §41, T-122).
  """
  setArticleCover(articleId: ID!, assetId: ID, focal: FocalPointInput): ArticleCover

  # Только для администраторов
  setArticleStatus(id: ID!, status: ArticleStatus!): Article!
  bulkDeleteArticles(ids: [ID!]!): [Article!]!
  bulkUpdateArticleStatus(ids: [ID!]!, status: ArticleStatus!): [Article!]!
}
