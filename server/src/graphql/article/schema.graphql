enum ArticleStatus {
  draft
  ai_check
  review
  in_review
  rework
  published
  archived
}

enum MyArticleStatus {
  draft
  ai_check
  review
  rework
  published
  rejected
  archived
}

enum ArticleArchiveActor {
  self
  staff
}

type Article {
  id: ID!
  title: String!
  slug: String!
  dek: String
  body: String!
  excerpt: String
  featuredImage: String
  status: ArticleStatus!
  publishedAt: String
  createdAt: String!
  updatedAt: String!
  author: User!
  section: Section
  format: Format
  tags: [Tag!]!
}

type MyArticleTranslation {
  id: ID!
  locale: Locale!
  slug: String!
  title: String!
  status: ArticleStatus!
  rejected: Boolean!
  publishedAt: String
  updatedAt: String!
  reeditUntil: String
  lastReviewMessageAt: String
  unread: Boolean!
}

type MyArticle {
  id: ID!
  status: ArticleStatus!
  archivedBy: ArticleArchiveActor
  section: Section
  format: Format
  tags: [Tag!]!
  translations: [MyArticleTranslation!]!
}

type MyArticleCounts {
  total: Int!
  draft: Int!
  ai_check: Int!
  review: Int!
  rework: Int!
  published: Int!
  rejected: Int!
  archived: Int!
}

type MyArticlesPageInfo {
  endCursor: ID
  hasNextPage: Boolean!
}

type MyArticlesConnection {
  items: [MyArticle!]!
  counts: MyArticleCounts!
  pageInfo: MyArticlesPageInfo!
}

# Специфичные для статей фильтры
input ArticleFiltersInput {
  # Наследуем базовые фильтры
  base: BaseFiltersInput

  # Статус статей
  status: [ArticleStatus!]

  # Специфичные для статей
  authorId: [ID!]
  sectionId: [ID!]
  tagIds: [ID!]
  publishedAt: DateRangeInput
}

type ArticlesResponse {
  articles: [Article!]!
  pagination: PaginationInfo!
  filters: ArticleFilters!
  sort: SortInfo!
  search: SearchInfo
}

type ArticleFilters {
  base: BaseFiltersInfo
  status: [ArticleStatus!]
  authorId: [ID!]
  sectionId: [ID!]
  tagIds: [ID!]
  publishedAt: DateRangeInfo
}

type ArticleDetail {
  article: Article!
  recommendedArticles: [Article!]!
  relatedArticles: [Article!]!
  articleStats: ArticleStats
}

type ArticleStats {
  readTime: Int! # В минутах
  wordCount: Int!
  viewCount: Int # В будущем
  shareCount: Int # В будущем
}

type GoneArticle {
  title: String!
  firstPublishedAt: String!
  unpublishedAt: String
  author: User!
  section: Section
}

type RelatedArticlesResponse {
  articles: [Article!]!
  totalCount: Int!
}

extend type Query {
  article(slug: String!): Article
  gone(locale: Locale!, sectionSlug: String!, slug: String!): GoneArticle

  # Комплексный запрос для страницы статьи
  articleDetail(slug: String!): ArticleDetail

  # Отдельные запросы для страницы статьи
  recommendedArticles(articleSlug: String!, limit: Int = 5): [Article!]!
  relatedArticles(articleSlug: String!, limit: Int = 10): [Article!]!
  articleStats(slug: String!): ArticleStats

  # Запросы для главной страницы
  featuredArticles(limit: Int = 5): [Article!]!
  latestArticles(limit: Int = 20, excludeFeatured: Boolean = false): [Article!]!
  popularArticles(timeRange: String = "week", limit: Int = 10): [Article!]!

  # Запросы для управления статьями (требуют права admin)
  articles(
    pagination: PaginationInput!
    sort: SortInput!
    filters: ArticleFiltersInput!
    search: SearchInput
  ): ArticlesResponse!

  myArticles(status: [MyArticleStatus!], cursor: ID, limit: Int = 20): MyArticlesConnection!
}

# Типы для мутаций
input CreateArticleInput {
  title: String!
  body: String!
  slug: String!
  dek: String
  excerpt: String
  featuredImage: String
  sectionId: ID
  formatId: ID
  tags: [ID!]
}

input UpdateArticleInput {
  title: String
  body: String
  slug: String
  dek: String
  excerpt: String
  featuredImage: String
  sectionId: ID
  formatId: ID
  tags: [ID!]
}

type Format {
  id: ID!
  name: String!
  nameEn: String
  slug: String!
  description: String
  descriptionEn: String
  status: TaxonomyStatus!
  archivedAt: String
  createdAt: String!
  updatedAt: String!
}

extend type Mutation {
  createArticle(input: CreateArticleInput!): Article!
  updateArticle(id: ID!, input: UpdateArticleInput!): Article!

  # Мутации для смены статуса
  archiveArticle(id: ID!): Article!
  requestReview(id: ID!): Article!
  revertToDraft(id: ID!): Article!

  # Только для администраторов
  setArticleStatus(id: ID!, status: ArticleStatus!): Article!
  bulkDeleteArticles(ids: [ID!]!): [Article!]!
  bulkUpdateArticleStatus(ids: [ID!]!, status: ArticleStatus!): [Article!]!
}
