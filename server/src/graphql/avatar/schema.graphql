"""
Аватар аккаунта (`docs/spec/85-media-and-binary/avatars.md`). Один на аккаунт; после базовой
технической обработки применяется публично сразу, без ожидания проверки (журнал §29.5).
"""
type Avatar {
  "Запись медиа, которой сейчас служит аватар."
  assetId: ID!
  """
  Адрес наибольшего готового квадратного варианта в WebP — один адрес для `<img>`. Полный набор
  для `<picture>` и `srcset` лежит в `variants`.
  """
  url: String!
  """
  Набор квадратных вариантов (`avatars.md` п. 3): `placeholder` — строка `data:` размытого
  заполнителя, `items` — публичные варианты (`format`, `width`, `height`, `url`) в AVIF и WebP.
  У аватара свой набор ширин, а не матрица медиа статьи (`image-variants.md` §3).
  """
  variants: JSON!
}

"""
Квадрат кадра в пикселях изображения, каким его видит автор (ориентация EXIF уже применена).
Кадрирование выбирает автор с предпросмотром (`image-variants.md` §2 п. 3); без аргумента
берётся наибольший центральный квадрат `[ДОПУЩЕНИЕ: поля и поведение по умолчанию]`.
"""
input AvatarCropInput {
  x: Int!
  y: Int!
  size: Int!
}

extend type AccountUser {
  """
  Аватар своего аккаунта; `null` — аватара нет, интерфейс показывает инициалы (журнал §25.4).
  У служебной записи аватара не бывает (§25.2).
  """
  avatar: Avatar
  """
  Предыдущая версия аватара: её возвращает рецензент при откате (журнал §29.5). `null` — прежней
  версии нет и возвращать нечего.
  """
  previousAvatar: Avatar
}

extend type Mutation {
  """
  Загрузка аватара (`profile-edit.md` §4): кадр применяется до конвейера, запись доводится до
  готовой и применяется сразу. Прежняя версия сохраняется для отката рецензентом.
  Служебная запись — `FORBIDDEN` (§25.2).
  """
  uploadAvatar(file: File!, crop: AvatarCropInput): Avatar

  "Удаление аватара (`avatars.md` п. 8): запись помечается удалённой, аккаунт показывает инициалы."
  removeAvatar: Avatar

  """
  Откат аватара к предыдущей версии рецензентом (матрица #120, журнал §29.5): пишется
  `profile.check` (#85) с `verdict: reverted`. Прежней версии нет — `CONFLICT`.
  """
  revertAvatar(userId: ID!, reason: String): Avatar
}
