enum AdminMailStatus {
  queued
  sent
  bounced
  failed
}

enum AdminMailAccess {
  full
  scoped
}

type AdminMailDeliveryEvent {
  id: ID!
  status: AdminMailStatus!
  providerEventId: String
  errorClass: String
  occurredAt: String!
}

type AdminMail {
  id: ID!
  template: String!
  """
  Адрес получателя: только analyst, admin и owner (журнал §27.6). В списке — маска, полный адрес
  отдаёт только карточка, и её открытие пишется в аудит admin.read.personal (журнал §28.7).
  """
  recipientEmail: String
  "Адрес отдан маской: полный адрес в этом ответе не раскрыт."
  recipientEmailMasked: Boolean!
  recipientHandle: String
  subject: String!
  """
  Сохранённая копия письма без секретов — только в карточке. В списке всегда null: иначе список
  был бы обходом записи чтения ПДн (журнал §28.7).
  """
  body: String
  status: AdminMailStatus!
  provider: String
  messageId: String
  deliveryErrorClass: String
  objectType: String
  objectId: ID
  jobId: ID
  queuedAt: String!
  sentAt: String
  createdAt: String!
  deliveryEvents: [AdminMailDeliveryEvent!]!
  "Зритель может повторить это письмо: право job.retry, техническая ошибка, полная копия, повтора ещё не было."
  canResend: Boolean!
}

type AdminMailList {
  items: [AdminMail!]!
  pagination: PaginationInfo!
  access: AdminMailAccess!
  "Письма ждут в очереди: почтовый провайдер их не забрал."
  providerWaiting: Boolean!
  "Право job.retry у зрителя: по нему раздел показывает или скрывает повтор."
  viewerCanResend: Boolean!
}

type AdminMailSummaryRow {
  template: String!
  queued: Int!
  sent: Int!
  bounced: Int!
  failed: Int!
}

type AdminMailResendResult {
  resent: Int!
  skipped: Int!
}

input AdminMailFiltersInput {
  template: String
  status: [AdminMailStatus!]
  period: DateRangeInput
  recipient: String
  objectId: ID
  query: String
}

extend type Query {
  adminMails(filters: AdminMailFiltersInput, pagination: PaginationInput): AdminMailList!
  adminMail(id: ID!): AdminMail
  mailSummary(period: AdminSummaryPeriod!): [AdminMailSummaryRow!]!
}

extend type Mutation {
  resendMail(id: ID!): AdminMail!
  resendMails(ids: [ID!]!): AdminMailResendResult!
}
