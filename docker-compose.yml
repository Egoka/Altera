services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: altera
      POSTGRES_USER: altera
      POSTGRES_PASSWORD: altera
    ports:
      # Собственные порты Altera (схема «2 + стандартный порт»), чтобы не конфликтовать
      # с другими локальными проектами, занимающими стандартные 5432/6379/1025/8025.
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altera -d altera"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "21025:1025"
      - "28025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
