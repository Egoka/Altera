# Фрагмент `ArticleCard` снят вместе с T-057: последняя публичная страница на
# административном `Article` — страница автора — перешла на `author` и `feed(scope: author)`.
# Форма карточки показа живёт в `~/types/reading` как `DemoArticleCard`.

fragment ArticleStatusValue on Article {
  status
}

# Карточка подборки главной: поля приходят из `feed`, а не из административного `Article`.
fragment FeedCard on FeedItem {
  id
  slug
  sectionSlug
  sectionName
  title
  dek
  cover
  publishedAt
  isTranslation
  author {
    name
    handle
    grade
  }
}
