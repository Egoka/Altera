fragment ArticleCard on Article {
  id
  title
  slug
  dek
  excerpt
  featuredImage
  publishedAt
  author {
    name
    slug: handle
    photoUrl
  }
  section {
    name
    slug
  }
}

fragment ArticleStatusValue on Article {
  status
}

# Карточка подборки главной: поля приходят из `feed`, а не из административного `Article`.
fragment FeedCard on FeedItem {
  id
  slug
  sectionSlug
  sectionName
  title
  dek
  cover
  publishedAt
  isTranslation
  author {
    name
    handle
    grade
  }
}
