  until: String
}

type AccountUser {
  _count: UserCount

  """Последствия архивирования своей записи (матрица #51)."""
  archivePreview: AccountArchivePreview!

  """
  Состояние своей архивированной записи; полному аккаунту — `FORBIDDEN` (матрица #116).
  """
  archiveState: AccountArchiveState!
  articles: [Article!]

  """
  Аватар своего аккаунта; `null` — аватара нет, интерфейс показывает инициалы (журнал §25.4).
  У служебной записи аватара не бывает (§25.2).
  """
  avatar: Avatar
  avatarAssetId: ID
  avatarCheckStatus: ProfileCheckStatus!
  bio: String

  """
  Свои согласия (`me.consents`, `legal-terms.md` §4). Чужие не отдаются никакой роли.
  """
  consents: [LegalConsent!]!
  createdAt: String!
  email: String!

  """Состояние смены адреса своей записи (матрица #49)."""
  emailChange: EmailChangeState!
  exports: [AccountExport!]!
  handle: String!

  """
  Есть ли у аккаунта хотя бы одна статья: без неё авторские разделы скрыты (журнал §8.21).
  """
  hasArticles: Boolean!
  id: ID!

  """
  Запись архивирована: ограниченная сессия пишет в редакцию как гость и указывает адрес сама
  (`contact.md` §8, строка «Заблокирован»).
  """
  isArchived: Boolean!
  locale: Locale!
  name: String!
  nameCheckStatus: ProfileCheckStatus!

  """
  Задан ли пароль. Аккаунт без пароля — обычное состояние: он входит по ссылке (журнал §34 п. 8),
  а в кабинете видит «задать пароль» вместо «сменить пароль».
  """
  passwordSet: Boolean!
  photoUrl: String
  prevAvatarId: ID

  """
  Предыдущая версия аватара: её возвращает рецензент при откате (журнал §29.5). `null` — прежней
  версии нет и возвращать нечего.
  """
  previousAvatar: Avatar
  role: Role!

  """
  Свои сессии (матрица доступа #47). Чужие сессии здесь недоступны никакой роли:
  аналитик к активным сессиям пользователей доступа не получает (журнал §26.6), а карточка
  пользователя в админке в эту задачу не входит.
  """
  sessions: [AccountSession!]!
  socialLinks: JSON

  """
  План своего аккаунта. `null` у служебной записи: она плана не покупает (§8.17), а её `/me`
  ведёт в админку (журнал §25.2).
  """
  subscription: AccountSubscription
  updatedAt: String!
}

