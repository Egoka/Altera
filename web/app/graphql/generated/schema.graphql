type AccountUser {
  _count: UserCount
  articles: [Article!]
  avatarAssetId: ID
  avatarCheckStatus: ProfileCheckStatus!
  bio: String
  createdAt: String!
  email: String!
  handle: String!
  id: ID!
  locale: Locale!
  name: String!
  nameCheckStatus: ProfileCheckStatus!
  photoUrl: String
  prevAvatarId: ID
  role: Role!
  socialLinks: JSON
  updatedAt: String!
}

type AdminSummary {
  cards: [AdminSummaryCard!]!
  role: Role!
}

type AdminSummaryCard {
  href: String!
  id: String!
  metrics: [AdminSummaryMetric!]!
  requestId: String
  status: AdminSummaryCardStatus!
}

enum AdminSummaryCardStatus {
  ERROR
  READY
}

type AdminSummaryMetric {
  id: String!
  value: Int!
}

enum AdminSummaryPeriod {
  DAYS_7
  DAYS_30
}

type Article {
  author: User!
  body: String!
  createdAt: String!
  dek: String
  excerpt: String
  featuredImage: String
  format: Format
  id: ID!
  publishedAt: String
  section: Section
  slug: String!
  status: ArticleStatus!
  tags: [Tag!]!
  title: String!
  updatedAt: String!
}

type ArticleDetail {
  article: Article!
  articleStats: ArticleStats
  recommendedArticles: [Article!]!
  relatedArticles: [Article!]!
}

type ArticleFilters {
  authorId: [ID!]
  base: BaseFiltersInfo
  publishedAt: DateRangeInfo
  sectionId: [ID!]
  status: [ArticleStatus!]
  tagIds: [ID!]
}

input ArticleFiltersInput {
  authorId: [ID!]
  base: BaseFiltersInput
  publishedAt: DateRangeInput
  sectionId: [ID!]
  status: [ArticleStatus!]
  tagIds: [ID!]
}

type ArticleStats {
  readTime: Int!
  shareCount: Int
  viewCount: Int
  wordCount: Int!
}

enum ArticleStatus {
  ai_check
  archived
  draft
  in_review
  published
  review
  rework
}

type ArticlesByAuthorResponse {
  articles: [Article!]!
  currentPage: Int!
  totalCount: Int!
  totalPages: Int!
}

type ArticlesBySectionResponse {
  articles: [Article!]!
  currentPage: Int!
  totalCount: Int!
  totalPages: Int!
}

type ArticlesByTagResponse {
  articles: [Article!]!
  currentPage: Int!
  totalCount: Int!
  totalPages: Int!
}

type ArticlesResponse {
  articles: [Article!]!
  filters: ArticleFilters!
  pagination: PaginationInfo!
  search: SearchInfo
  sort: SortInfo!
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  user: AccountUser!
}

type AuthorStats {
  articlesThisMonth: Int!
  popularTags: [Tag!]
  totalArticles: Int!
}

type BaseFiltersInfo {
  createdAt: DateRangeInfo
  updatedAt: DateRangeInfo
}

input BaseFiltersInput {
  createdAt: DateRangeInput
  updatedAt: DateRangeInput
}

input CreateArticleInput {
  body: String!
  dek: String
  excerpt: String
  featuredImage: String
  formatId: ID
  sectionId: ID
  slug: String!
  tags: [ID!]
  title: String!
}

input CreateSectionInput {
  description: String
  descriptionEn: String
  name: String!
  nameEn: String!
  order: Int!
  seoDescription: String
  seoDescriptionEn: String
  seoTitle: String
  seoTitleEn: String
  slug: String!
}

input CreateTagInput {
  description: String
  name: String!
  nameEn: String
  slug: String!
}

type DateRangeInfo {
  from: String
  to: String
}

input DateRangeInput {
  from: String
  to: String
}

type Format {
  archivedAt: String
  createdAt: String!
  description: String
  descriptionEn: String
  id: ID!
  name: String!
  nameEn: String
  slug: String!
  status: TaxonomyStatus!
  updatedAt: String!
}

scalar JSON

enum Locale {
  en
  ru
}

input MergeTagsInput {
  sourceTagIds: [ID!]!
  targetTagId: ID!
}

type Mutation {
  _empty: String
  archiveArticle(id: ID!): Article!
  archiveSection(id: ID!, successorId: ID!): Section!
  archiveTag(id: ID!): Tag!
  bulkDeleteArticles(ids: [ID!]!): [Article!]!
  bulkUpdateArticleStatus(ids: [ID!]!, status: ArticleStatus!): [Article!]!
  createArticle(input: CreateArticleInput!): Article!
  createSection(input: CreateSectionInput!): Section!
  createTag(input: CreateTagInput!): Tag!
  deleteSection(id: ID!): Section!
  deleteTag(id: ID!): Tag!
  mergeTags(input: MergeTagsInput!): Tag!
  reorderSections(input: ReorderSectionsInput!): [Section!]!
  requestMagicLink(email: String!, locale: Locale!): Boolean!
  requestReview(id: ID!): Article!
  restoreSection(id: ID!): Section!
  restoreTag(id: ID!): Tag!
  revertToDraft(id: ID!): Article!
  setArticleStatus(id: ID!, status: ArticleStatus!): Article!
  updateArticle(id: ID!, input: UpdateArticleInput!): Article!
  updateSection(id: ID!, input: UpdateSectionInput!): Section!
  updateTag(id: ID!, input: UpdateTagInput!): Tag!
  verifyMagicLink(token: String!): AuthPayload!
}

type PaginationInfo {
  currentPage: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  itemsPerPage: Int!
  totalItems: Int!
  totalPages: Int!
}

input PaginationInput {
  limit: Int! = 20
  maxLimit: Int = 100
  page: Int! = 1
}

enum ProfileCheckStatus {
  ok
  pending
  rejected
}

type PublicSection {
  articleCount: Int!
  id: ID!
  name: String!
  nameEn: String
  order: Int!
  slug: String!
}

type Query {
  _empty: String
  adminSummary(period: AdminSummaryPeriod!): AdminSummary!
  adminUser(id: ID!): AccountUser
  article(slug: String!): Article
  articleDetail(slug: String!): ArticleDetail
  articleStats(slug: String!): ArticleStats
  articles(filters: ArticleFiltersInput!, pagination: PaginationInput!, search: SearchInput, sort: SortInput!): ArticlesResponse!
  articlesByAuthor(authorHandle: String!, limit: Int = 10, page: Int = 1): ArticlesByAuthorResponse!
  articlesBySection(limit: Int = 10, page: Int = 1, sectionSlug: String!): ArticlesBySectionResponse!
  articlesByTag(limit: Int = 10, page: Int = 1, tagSlug: String!): ArticlesByTagResponse!
  author(handle: String!): User
  authorStats(authorHandle: String!): AuthorStats
  featuredArticles(limit: Int = 5): [Article!]!
  latestArticles(excludeFeatured: Boolean = false, limit: Int = 20): [Article!]!
  me: AccountUser
  myArticlesStats: UserArticleStats
  popularArticles(limit: Int = 10, timeRange: String = "week"): [Article!]!
  publicSections: [PublicSection!]!
  recommendedArticles(articleSlug: String!, limit: Int = 5): [Article!]!
  relatedArticles(articleSlug: String!, limit: Int = 10): [Article!]!
  section(slug: String!): Section
  sectionStats(sectionSlug: String!): SectionStats
  sections(filters: SectionFiltersInput!, pagination: PaginationInput!, search: SearchInput, sort: SortInput!): SectionsResponse!
  tag(slug: String!): Tag
  tagStats(tagSlug: String!): TagStats
  tags(filters: TagFiltersInput!, pagination: PaginationInput!, search: SearchInput, sort: SortInput!): TagsResponse!
  user(handle: String!): User
  users(filters: UserFiltersInput!, pagination: PaginationInput!, search: SearchInput, sort: SortInput!): UsersResponse!
}

type RelatedArticlesResponse {
  articles: [Article!]!
  totalCount: Int!
}

input ReorderItemInput {
  id: ID!
  order: Int!
}

input ReorderSectionsInput {
  items: [ReorderItemInput!]!
}

enum Role {
  admin
  analyst
  author
  editor
  moderator
  owner
  reader
}

type SearchInfo {
  fields: [String!]
  query: String!
}

input SearchInput {
  fields: [String!]
  query: String!
}

type Section {
  _count: SectionCount
  archivedAt: String
  archivedByActorId: ID
  archivedByRole: Role
  articles: [Article!]
  createdAt: String!
  description: String
  descriptionEn: String
  id: ID!
  name: String!
  nameEn: String
  order: Int!
  seoDescription: String
  seoDescriptionEn: String
  seoTitle: String
  seoTitleEn: String
  slug: String!
  status: TaxonomyStatus!
  successor: Section
  updatedAt: String!
}

type SectionCount {
  articles: Int!
}

type SectionFilters {
  base: BaseFiltersInfo
  hasArticles: Boolean
  status: [TaxonomyStatus!]
}

input SectionFiltersInput {
  base: BaseFiltersInput
  hasArticles: Boolean
  status: [TaxonomyStatus!]
}

type SectionStats {
  articlesThisMonth: Int!
  averageReadTime: Float
  popularTags: [Tag!]
  topAuthors: [User!]
  totalArticles: Int!
}

type SectionsResponse {
  filters: SectionFilters!
  pagination: PaginationInfo!
  search: SearchInfo
  sections: [Section!]!
  sort: SortInfo!
}

enum SortDirection {
  ASC
  DESC
}

type SortInfo {
  direction: SortDirection!
  field: String!
}

input SortInput {
  direction: SortDirection! = ASC
  field: String!
}

type Tag {
  _count: TagCount
  archivedAt: String
  archivedByActorId: ID
  archivedByRole: Role
  articles: [Article!]
  createdAt: String!
  createdByActorId: ID
  createdByRole: Role
  description: String
  id: ID!
  mergedInto: Tag
  name: String!
  nameEn: String
  slug: String!
  status: TaxonomyStatus!
  updatedAt: String!
}

type TagCount {
  articles: Int!
}

type TagFilters {
  base: BaseFiltersInfo
  hasArticles: Boolean
}

input TagFiltersInput {
  base: BaseFiltersInput
  hasArticles: Boolean
}

type TagStats {
  articlesThisMonth: Int!
  averageReadTime: Float
  popularAuthors: [User!]
  totalArticles: Int!
}

type TagsResponse {
  filters: TagFilters!
  pagination: PaginationInfo!
  search: SearchInfo
  sort: SortInfo!
  tags: [Tag!]!
}

enum TaxonomyStatus {
  active
  archived
}

input UpdateArticleInput {
  body: String
  dek: String
  excerpt: String
  featuredImage: String
  formatId: ID
  sectionId: ID
  slug: String
  tags: [ID!]
  title: String
}

input UpdateSectionInput {
  description: String
  descriptionEn: String
  name: String
  nameEn: String
  order: Int
  seoDescription: String
  seoDescriptionEn: String
  seoTitle: String
  seoTitleEn: String
  slug: String
}

input UpdateTagInput {
  description: String
  name: String
  nameEn: String
  slug: String
}

type User {
  _count: UserCount
  articles: [Article!]
  bio: String
  createdAt: String!
  handle: String!
  id: ID!
  name: String!
  photoUrl: String
  socialLinks: JSON
  updatedAt: String!
}

type UserArticleStats {
  archived: Int!
  draft: Int!
  published: Int!
  review: Int!
  total: Int!
}

type UserCount {
  articles: Int!
}

type UserFilters {
  base: BaseFiltersInfo
  hasArticles: Boolean
  role: [Role!]
}

input UserFiltersInput {
  base: BaseFiltersInput
  hasArticles: Boolean
  role: [Role!]
}

type UsersResponse {
  filters: UserFilters!
  pagination: PaginationInfo!
  search: SearchInfo
  sort: SortInfo!
  users: [AccountUser!]!
}