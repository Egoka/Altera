"""
Исходы входа по паролю (журнал §34 п. 6–8, `10-flows/register-and-login.md` §3а). Ветки архива
и повторного согласия те же, что у входа по ссылке: способ входа на состояние аккаунта не влияет.
"""
enum PasswordLoginOutcome {
  """
  Аккаунт заблокирован администратором: сессии нет, переход к форме оспаривания.
  """
  archived_admin

  """
  Аккаунт архивирован самим пользователем: ограниченная сессия и экран `/me/archived`.
  """
  archived_self

  """Сессия создана: переход на `next` или `/me`."""
  authenticated

  """
  Версия оферты или политики изменилась: экран повторного согласия по `consentToken`.
  """
  consent_required

  """
  Пароль верен, но адрес ещё не подтверждён письмом: вход закрыт до подтверждения (§34 п. 7).
  Письмо с подтверждением отправляется заново.
  """
  email_unconfirmed
}

type PasswordLoginResult {
  """Токен формы оспаривания — как у ветки ссылки (журнал #48)."""
  appealToken: String

  """
  Одноразовый токен для экрана повторного согласия `/auth/verify?token=`: пароль уже доказал
  владение аккаунтом, поэтому письмо для этого шага не нужно.
  """
  consentToken: String
  next: String
  outcome: PasswordLoginOutcome!
