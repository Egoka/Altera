query LegalVersions($locale: Locale!) {
  legalVersions(locale: $locale) {
    termsVersion
    privacyVersion
    termsPath
    privacyPath
  }
}

mutation RequestMagicLink($email: String!, $consentVersion: ConsentVersionsInput!, $locale: Locale!, $next: String) {
  requestMagicLink(email: $email, consentVersion: $consentVersion, locale: $locale, next: $next) {
    ok
    retryAfterSec
  }
}

# `refreshToken` выбирается ради BFF: маршрут `/api/graphql` переносит его в httpOnly-cookie
# и возвращает браузеру null (ADR-0023 п. 2).
mutation VerifyMagicLink($token: String!) {
  verifyMagicLink(token: $token) {
    ...VerifyOutcome
  }
}

mutation AcceptConsent($token: String!, $termsVersion: Int, $privacyVersion: Int) {
  acceptConsent(token: $token, termsVersion: $termsVersion, privacyVersion: $privacyVersion) {
    ...VerifyOutcome
  }
}

fragment VerifyOutcome on VerifyMagicLinkResult {
  outcome
  next
  isNewAccount
  termsVersion
  privacyVersion
  appealToken
  session {
    accessToken
    refreshToken
    user {
      id
      name
      email
      role
      handle
      locale
    }
  }
}

# Значение переменной подставляет BFF из cookie; клиент её не передаёт.
mutation RefreshSession($refreshToken: String! = "") {
  refreshSession(refreshToken: $refreshToken) {
    accessToken
    refreshToken
    user {
      id
      name
      email
      role
      handle
    }
  }
}

mutation Logout($refreshToken: String) {
  logout(refreshToken: $refreshToken)
}

mutation LogoutAll {
  logoutAll
}
