query LegalVersions($locale: Locale!) {
  legalVersions(locale: $locale) {
    termsVersion
    privacyVersion
    termsPath
    privacyPath
  }
}

mutation RequestMagicLink($email: String!, $consentVersion: ConsentVersionsInput!, $locale: Locale!, $next: String) {
  requestMagicLink(email: $email, consentVersion: $consentVersion, locale: $locale, next: $next) {
    ok
    retryAfterSec
  }
}

# `refreshToken` выбирается ради BFF: маршрут `/api/graphql` переносит его в httpOnly-cookie
# и возвращает браузеру null (ADR-0023 п. 2).
mutation VerifyMagicLink($token: String!) {
  verifyMagicLink(token: $token) {
    ...VerifyOutcome
  }
}

mutation AcceptConsent($token: String!, $termsVersion: Int, $privacyVersion: Int) {
  acceptConsent(token: $token, termsVersion: $termsVersion, privacyVersion: $privacyVersion) {
    ...VerifyOutcome
  }
}

fragment VerifyOutcome on VerifyMagicLinkResult {
  outcome
  next
  isNewAccount
  termsVersion
  privacyVersion
  appealToken
  session {
    accessToken
    refreshToken
    user {
      id
      name
      email
      role
      handle
      locale
    }
  }
}

# Значение переменной подставляет BFF из cookie; клиент её не передаёт.
mutation RefreshSession($refreshToken: String! = "") {
  refreshSession(refreshToken: $refreshToken) {
    accessToken
    refreshToken
    user {
      id
      name
      email
      role
      handle
    }
  }
}

mutation Logout($refreshToken: String) {
  logout(refreshToken: $refreshToken)
}

mutation LogoutAll {
  logoutAll
}

# Ветка пароля (T-115, журнал §34 п. 6–8). `refreshToken` выбирается ради BFF: маршрут
# `/api/graphql` переносит его в httpOnly-cookie и возвращает браузеру null (ADR-0023 п. 2).
fragment PasswordLoginOutcome on PasswordLoginResult {
  outcome
  next
  termsVersion
  privacyVersion
  appealToken
  consentToken
  session {
    accessToken
    refreshToken
    user {
      id
      name
      email
      role
      handle
      locale
    }
  }
}

mutation RegisterWithPassword(
  $email: String!
  $password: String!
  $consentVersion: ConsentVersionsInput!
  $locale: Locale!
  $next: String
) {
  registerWithPassword(
    email: $email
    password: $password
    consentVersion: $consentVersion
    locale: $locale
    next: $next
  ) {
    ok
    retryAfterSec
  }
}

mutation LoginWithPassword($email: String!, $password: String!, $next: String) {
  loginWithPassword(email: $email, password: $password, next: $next) {
    ...PasswordLoginOutcome
  }
}

mutation ConfirmEmail($token: String!) {
  confirmEmail(token: $token) {
    ...PasswordLoginOutcome
  }
}

mutation RequestPasswordReset($email: String!, $locale: Locale!) {
  requestPasswordReset(email: $email, locale: $locale) {
    ok
    retryAfterSec
  }
}

mutation ResetPassword($token: String!, $password: String!) {
  resetPassword(token: $token, password: $password) {
    ...PasswordLoginOutcome
  }
}
