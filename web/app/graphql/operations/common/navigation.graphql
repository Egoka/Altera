query GetNavigation {
  publicSections {
    id
    name
    nameEn
    slug
    order
    articleCount
  }
  popularTags: tags(
    pagination: { page: 1, limit: 10 }
    sort: { field: "createdAt", direction: DESC }
    filters: { base: {}, hasArticles: true }
  ) {
    tags {
      name
      slug
    }
  }
}

query GetUserMenu {
  me {
    id
    name
    handle
    photoUrl
    role
  }
}
