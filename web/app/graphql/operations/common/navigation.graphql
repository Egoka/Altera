query GetNavigation($locale: Locale!) {
  # Рубрики меню — только непустые в локали страницы (журнал §20.9): английская шапка не
  # показывает рубрику без английских материалов.
  publicSections(locale: $locale) {
    id
    name
    nameEn
    slug
    order
    articleCount
  }
  # Популярные теги шапки — публичный каталог: прежний `tags` требует прав админа,
  # и весь запрос навигации падал для гостя.
  popularTags(locale: $locale, limit: 10) {
    slug
    name
    articleCount
  }
}

query GetUserMenu {
  me {
    id
    name
    handle
    photoUrl
    role
  }
}
