query GetArticleForEdit($slug: String!) {
  article(slug: $slug) {
    id
    title
    slug
    dek
    body
    excerpt
    featuredImage
    status
    section {
      id
      name
      slug
    }
    tags {
      id
      name
      slug
    }
  }
  sections(pagination: { page: 1, limit: 100 }, sort: { field: "order", direction: ASC }, filters: { base: {} }) {
    sections {
      id
      name
      slug
    }
  }
  tags(pagination: { page: 1, limit: 100 }, sort: { field: "name", direction: ASC }, filters: { base: {} }) {
    tags {
      id
      name
      slug
    }
  }
}

mutation CreateArticle($input: CreateArticleInput!) {
  createArticle(input: $input) {
    id
    slug
    title
  }
}

mutation UpdateArticle($id: ID!, $input: UpdateArticleInput!) {
  updateArticle(id: $id, input: $input) {
    id
    slug
    title
    status
  }
}

mutation DeleteArticle($id: ID!) {
  deleteArticle: archiveArticle(id: $id) {
    id
    status
  }
}

query GetMyArticles($status: [MyArticleStatus!], $cursor: ID, $limit: Int = 20) {
  myArticles(status: $status, cursor: $cursor, limit: $limit) {
    items {
      id
      status
      archivedBy
      section {
        id
        name
        slug
      }
      format {
        id
        name
        slug
      }
      tags {
        id
        name
        slug
      }
      translations {
        id
        locale
        slug
        title
        status
        rejected
        publishedAt
        updatedAt
        reeditUntil
        lastReviewMessageAt
        unread
      }
    }
    counts {
      total
      draft
      ai_check
      review
      rework
      published
      rejected
      archived
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
