query GetMyProfile {
  me {
    id
    name
    email
    bio
    photoUrl
    role
    handle
    locale
    avatarAssetId
    prevAvatarId
    nameCheckStatus
    avatarCheckStatus
    socialLinks
    createdAt
  }
  myArticlesStats {
    total
    published
    draft
    review
    archived
  }
}
