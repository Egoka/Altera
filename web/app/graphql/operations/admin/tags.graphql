query GetAdminTags(
  $pagination: PaginationInput! = { page: 1, limit: 50 }
  $sort: SortInput! = { field: "_count.articles", direction: DESC }
  $filters: TagFiltersInput! = { base: {}, status: [active] }
) {
  tags(pagination: $pagination, sort: $sort, filters: $filters) {
    tags {
      ...TagSummary
      nameEn
      status
      archivedAt
      archivedByRole
      mergedInto {
        id
        name
        slug
      }
      _count {
        articles
      }
    }
    pagination {
      currentPage
      totalPages
      totalItems
    }
  }
}

mutation CreateTag($input: CreateTagInput!) {
  createTag(input: $input) {
    id
    name
    slug
    description
  }
}

mutation UpdateTag($id: ID!, $input: UpdateTagInput!) {
  updateTag(id: $id, input: $input) {
    id
    name
    slug
    description
  }
}

mutation DeleteTag($id: ID!) {
  deleteTag(id: $id) {
    id
  }
}

mutation MergeTags($input: MergeTagsInput!) {
  mergeTags(input: $input) {
    id
    name
    slug
  }
}

mutation ArchiveTag($id: ID!) {
  archiveTag(id: $id) {
    id
    status
  }
}

mutation RestoreTag($id: ID!) {
  restoreTag(id: $id) {
    id
    status
  }
}
