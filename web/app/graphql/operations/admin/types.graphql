query GetAdminSections(
  $pagination: PaginationInput! = { page: 1, limit: 50 }
  $sort: SortInput! = { field: "order", direction: ASC }
  $filters: SectionFiltersInput! = { base: {} }
) {
  sections(pagination: $pagination, sort: $sort, filters: $filters) {
    sections {
      ...SectionSummary
      _count {
        articles
      }
    }
    pagination {
      currentPage
      totalPages
      totalItems
    }
  }
}

mutation CreateSection($input: CreateSectionInput!) {
  createSection(input: $input) {
    id
    name
    slug
    description
    order
    status
  }
}

mutation UpdateSection($id: ID!, $input: UpdateSectionInput!) {
  updateSection(id: $id, input: $input) {
    id
    name
    slug
    description
    order
    status
  }
}

mutation DeleteSection($id: ID!) {
  deleteSection(id: $id) {
    id
  }
}

mutation ReorderSections($input: ReorderSectionsInput!) {
  reorderSections(input: $input) {
    id
    order
  }
}

mutation ArchiveSection($id: ID!, $successorId: ID!) {
  archiveSection(id: $id, successorId: $successorId) {
    id
    status
  }
}
