fragment AdminArticleRowFields on AdminArticleRow {
  id
  articleId
  title
  slug
  locale
  status
  rejected
  readCount
  publishedAt
  updatedAt
  editorial
  author {
    id
    name
    handle
  }
  section {
    id
    name
    slug
  }
  format {
    id
    name
    slug
  }
  tags {
    id
    name
    slug
  }
  archive {
    at
    actorId
    role
    reason
  }
}

query GetAdminArticles($filters: AdminArticleFiltersInput, $pagination: PaginationInput, $sort: AdminArticleSort) {
  adminArticles(filters: $filters, pagination: $pagination, sort: $sort) {
    items {
      ...AdminArticleRowFields
    }
    pagination {
      currentPage
      totalPages
      totalItems
      itemsPerPage
      hasNextPage
      hasPreviousPage
    }
  }
}

query GetAdminArticleFilterOptions {
  adminArticleFilterOptions {
    sections {
      id
      name
      slug
    }
    formats {
      id
      name
      slug
    }
    tags {
      id
      name
      slug
    }
  }
}

query GetAdminArticle($id: ID!) {
  adminArticle(id: $id) {
    id
    articleId
    title
    slug
    locale
    status
    rejected
    readCount
    publishedAt
    updatedAt
    editorial
    dek
    excerpt
    body
    author {
      id
      name
      handle
    }
    section {
      id
      name
      slug
    }
    format {
      id
      name
      slug
    }
    tags {
      id
      name
      slug
    }
    archive {
      at
      actorId
      role
      reason
    }
    cover {
      id
      alt
      variants
    }
    siblings {
      id
      locale
      title
      slug
      status
      rejected
    }
    revisions {
      id
      title
      kind
      note
      size
      createdAt
      author {
        id
        name
        handle
        role
      }
    }
    decisions {
      id
      kind
      text
      recommendations
      byRole
      createdAt
      replies {
        id
        text
        byRole
        createdAt
      }
    }
  }
}

mutation ArchiveAdminArticle($id: ID!, $reason: String!) {
  archiveArticle(id: $id, reason: $reason) {
    id
    status
  }
}

mutation RestoreAdminArticle($id: ID!) {
  restoreArticle(id: $id) {
    id
    status
  }
}
