query GetArticle($slug: String!) {
  article(slug: $slug) {
    id
    title
    slug
    dek
    body
    excerpt
    featuredImage
    status
    publishedAt
    createdAt
    updatedAt
    author {
      id
      name
      slug: handle
      bio
      photoUrl
      socialLinks
    }
    section {
      name
      slug
    }
    tags {
      name
      slug
    }
  }
  relatedArticles(articleSlug: $slug, limit: 5) {
    id
    title
    slug
    dek
    featuredImage
    author {
      name
      slug: handle
    }
  }
}
