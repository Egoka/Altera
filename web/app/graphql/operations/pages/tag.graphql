query GetTagPage($slug: String!, $page: Int = 1, $limit: Int = 20) {
  tag(slug: $slug) {
    id
    name
    slug
    description
  }
  articlesByTag(tagSlug: $slug, page: $page, limit: $limit) {
    articles {
      id
      title
      slug
      dek
      excerpt
      featuredImage
      publishedAt
      author {
        name
        slug: handle
        photoUrl
      }
      section {
        name
        slug
      }
    }
    totalCount
    totalPages
    currentPage
  }
}
