query GetSectionPage($slug: String!, $page: Int = 1, $limit: Int = 20) {
  section(slug: $slug) {
    id
    name
    slug
    description
    order
    status
  }
  articlesBySection(sectionSlug: $slug, page: $page, limit: $limit) {
    articles {
      id
      title
      slug
      dek
      excerpt
      featuredImage
      publishedAt
      author {
        name
        slug: handle
        photoUrl
      }
      tags {
        name
        slug
      }
    }
    totalCount
    totalPages
    currentPage
  }
}

query GetSectionRedirect($slug: String!) {
  section(slug: $slug) {
    status
    successor {
      slug
    }
  }
}
