query GetContentTypePage($slug: String!, $page: Int = 1, $limit: Int = 20) {
  contentType(slug: $slug) {
    id
    name
    slug
    description
    order
    status
  }
  articlesByContentType(contentTypeSlug: $slug, page: $page, limit: $limit) {
    articles {
      id
      title
      slug
      dek
      excerpt
      featuredImage
      publishedAt
      author {
        name
        slug: handle
        photoUrl
      }
      sectionTags {
        name
        slug
      }
    }
    totalCount
    totalPages
    currentPage
  }
}
